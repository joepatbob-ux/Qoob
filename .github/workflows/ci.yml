#
# CI — build and test on every push.
#
# This is what makes the test suite load-bearing rather than something only ever run
# by hand. The suites are pure model code, so they need a simulator only because the
# tests are hosted by the app; nothing here touches a device.
#
# Note the project file is generated, not tracked (see .gitignore), so the first real
# step is always `xcodegen generate` — a clone has nothing to open without it.
#

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So it can be kicked off by hand without pushing, which is useful while this
  # workflow itself is being tuned.
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run irrelevant. macOS runners bill at a 10x
  # multiplier, so not cancelling superseded runs gets expensive quickly.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Needs Xcode 26 or newer, and not because of the deployment target — the app
    # calls Liquid Glass (`Glass`, `glassEffect`) behind a runtime
    # `#available(iOS 26.0, *)`. A runtime guard still needs the symbol to exist in
    # the SDK at compile time, so Xcode 16 on macos-15 cannot build this at all.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Deliberately the runner's default Xcode rather than a pinned path: exact point
      # releases on an image change over time, and pinning /Applications/Xcode_26.app
      # breaks the moment that name isn't there.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -i iphone || true

      # Fail with a sentence rather than four pages of "cannot find 'Glass' in scope".
      - name: Require Xcode 26+
        run: |
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          echo "Xcode major version: $major"
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is too old. Qoob calls Liquid Glass, which needs the iOS 26 SDK even though it ships to iOS 18."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # OS=latest rather than a pinned 18.0: the runner carries whichever iOS 18.x
      # simulator matches its Xcode, and a missing exact version fails the whole run.
      - name: Test
        run: |
          xcodebuild test \
            -project Qoob.xcodeproj \
            -scheme Qoob \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Kept on failure so a red run can be diagnosed without reproducing locally.
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
