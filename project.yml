#
#  project.yml — XcodeGen spec for Qoob
#
#  Generate the Xcode project with:
#      brew install xcodegen        # once
#      cd Qoob
#      xcodegen generate
#      open Qoob.xcodeproj
#
#  The generated Qoob.xcodeproj is NOT tracked (see .gitignore), so a fresh clone
#  has to run xcodegen before there is anything to open. This spec is the single
#  source of truth for the project layout and build settings.
#
#  One target, several destinations: iPhone, iPad, Mac (via Catalyst) and Apple TV.
#  The platform differences live in the sources behind `#if os(...)` — see Haptics,
#  ControllerInput and the touch-only sections of ContentView/GameControls.
#
name: Qoob
# Pins the project's recorded "last upgrade check" to the Xcode version in use
# (27.0 -> 2700). XcodeGen otherwise hardcodes an old default (1430, ~Xcode
# 14.3) on every regenerate, which makes Xcode think the settings baseline is
# perpetually stale and re-show "Update to Recommended Settings" on every
# open — even for settings that are already correct. Bump this when the team
# moves to a newer Xcode.
attributes:
  LastUpgradeCheck: "2700"
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    # iOS 18 so image-based lighting needs no fallback: building an
    # EnvironmentResource from a runtime image requires 18, and the older
    # generate(fromEquirectangular:) is unavailable rather than deprecated.
    iOS: "18.0"
    tvOS: "26.0"        # RealityKit's ARView only reached tvOS in 26
  createIntermediateGroups: true

# Project-level settings so Xcode's "recommended settings" prompt (Dead Code
# Stripping, User Script Sandboxing) has nothing left to offer — settings made
# only through that dialog live in the generated, gitignored .xcodeproj and are
# wiped out by the next `xcodegen generate`.
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Qoob:
    type: application
    supportedDestinations: [iOS, macCatalyst, tvOS]
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
      # Note: the bundled 3D models live inside Resources/Assets.xcassets as
      # `Model_*.dataset` Data Sets, so they need no entry here (or in
      # project.pbxproj) — the asset catalogue is a single folder reference and
      # actool compiles whatever is inside it. See BUILD.md.
    # For "Match local weather" (Settings). At the repo root rather than under
    # Sources/, so it isn't swept up by the glob above. Requires a real Team ID
    # and the WeatherKit capability enabled on that team's App ID — see BUILD.md.
    entitlements:
      path: Qoob.entitlements
      properties:
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qoob
        PRODUCT_NAME: Qoob
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 1 = iPhone, 2 = iPad, 3 = Apple TV
        TARGETED_DEVICE_FAMILY: "1,2,3"
        SUPPORTS_MACCATALYST: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets:
        - QoobTests

  # Unit tests over the pure model: Level generation, BoardModel, CubeState,
  # Furniture and ModelFit. Deliberately no rendering — everything under test here
  # runs without RealityKit, a view or a device, which is why Core keeps that
  # boundary.
  QoobTests:
    type: bundle.unit-test
    # iOS only. The suites are platform-independent, and adding Catalyst/tvOS
    # destinations here just multiplies the ways the test bundle can fail to host.
    supportedDestinations: [iOS]
    sources:
      - path: Tests
    dependencies:
      - target: Qoob
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qoob.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        DEAD_CODE_STRIPPING: YES
